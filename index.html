<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>記帳本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: sticky glass top bar → (desktop) left column with per-currency balance summary + source cards, right column with the ledger grouped by day; (mobile) single column, sources scroll sideways, floating add button. Accent tokens are overridden at runtime by the chosen theme colour. */
:root{
  --bg:#eef1f3; --surface:#ffffff; --surface-2:#f5f7f8; --line:#dfe5e8;
  --fg:#16211f; --muted:#64716e;
  --accent:#0d7a6f; --accent-ink:#ffffff; --accent-soft:#d6eeea;
  --hero:#0f3b36; --hero-ink:#f1f7f6; --hero-muted:#9cc4bd; --hero-line:rgba(255,255,255,.06);
  --danger:#c53a2f; --danger-soft:#fbe5e2; --warn:#b06d12;
  --shadow:0 1px 2px rgba(16,33,31,.05),0 8px 24px -12px rgba(16,33,31,.18);
  --av-s:55%; --av-bg-l:91%; --av-fg-l:30%;
  --font-body:"Noto Sans TC","Noto Sans SC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-num:"Manrope","Noto Sans TC","Noto Sans SC",system-ui,sans-serif;
  color-scheme:light;
}
:root[lang="zh-Hans"]{--font-body:"Noto Sans SC","Noto Sans TC","PingFang SC","Microsoft YaHei",system-ui,sans-serif}
:root[lang="en"]{--font-body:"Manrope","Noto Sans TC",system-ui,sans-serif}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1312; --surface:#131c1b; --surface-2:#192423; --line:#24312f;
    --fg:#e4eeec; --muted:#8a9c98;
    --accent:#3cc4b2; --accent-ink:#04211d; --accent-soft:#143431;
    --hero:#123a35; --hero-muted:#8fbab2; --hero-line:rgba(255,255,255,.05);
    --danger:#ff7b6e; --danger-soft:#3a1d1a; --warn:#f0a94a;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
    --av-s:40%; --av-bg-l:20%; --av-fg-l:74%;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1312; --surface:#131c1b; --surface-2:#192423; --line:#24312f;
  --fg:#e4eeec; --muted:#8a9c98;
  --accent:#3cc4b2; --accent-ink:#04211d; --accent-soft:#143431;
  --hero:#123a35; --hero-muted:#8fbab2; --hero-line:rgba(255,255,255,.05);
  --danger:#ff7b6e; --danger-soft:#3a1d1a; --warn:#f0a94a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
  --av-s:40%; --av-bg-l:20%; --av-fg-l:74%;
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden;transition:background-color .35s,color .35s}
body.locked{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3{text-wrap:balance}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.muted{color:var(--muted)}
.small{font-size:12.5px}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.topbar{position:sticky;top:0;z-index:20;background:var(--bg);background:color-mix(in srgb,var(--bg) 80%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.topbar-in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:38px;height:38px;border-radius:11px;background:var(--hero);color:var(--hero-ink);display:grid;place-items:center;font-weight:700;font-size:18px;flex:none;transition:background-color .35s}
.brand h1{font-size:18px;font-weight:700;letter-spacing:.02em}
.brand p{font-size:12.5px;color:var(--muted)}
.top-actions{display:flex;gap:8px;align-items:center}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:10px 16px;border-radius:12px;font-weight:500;font-size:14.5px;transition:transform .12s,background-color .18s,border-color .18s,box-shadow .18s;white-space:nowrap}
.btn:hover{border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;pointer-events:none}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;box-shadow:0 6px 16px -8px var(--accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{background:var(--danger);color:#fff;border-color:transparent}
.btn.ghost-danger{background:transparent;border-color:transparent;color:var(--danger);padding-inline:10px}
.btn.ghost-danger:hover{background:var(--danger-soft)}
.btn.outline-danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.btn.outline-danger:hover{background:var(--danger-soft)}
.btn.sm{padding:8px 12px;font-size:13.5px;border-radius:10px}
.btn.dashed{width:100%;border-style:dashed;background:transparent;color:var(--accent)}
.btn svg{width:18px;height:18px}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:11px;border:1px solid transparent;background:transparent;color:var(--muted);transition:background-color .18s,color .18s,transform .12s;flex:none;padding:0}
.icon-btn:hover{background:var(--surface-2);color:var(--fg)}
.icon-btn:active{transform:scale(.94)}
.icon-btn svg{width:20px;height:20px}
.icon-btn.boxed{border-color:var(--line);background:var(--surface)}
.icon-btn.sm{width:32px;height:32px;border-radius:9px}
.icon-btn.sm svg{width:16px;height:16px}

/* layout */
.layout{display:grid;gap:24px;padding-block:20px 120px}
@media (min-width:900px){
  .layout{grid-template-columns:340px minmax(0,1fr);align-items:start;gap:32px;padding-block:28px 60px}
  .side{position:sticky;top:calc(80px + env(safe-area-inset-top,0px))}
}
.side{display:flex;flex-direction:column;gap:22px;min-width:0}
.sec-title{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--muted);margin-bottom:10px}
.link{background:none;border:0;color:var(--accent);font-size:13px;font-weight:500;letter-spacing:0;padding:4px 6px;border-radius:8px}
.link:hover{background:var(--accent-soft)}

.code{font-family:var(--font-num);font-weight:700;font-size:11px;letter-spacing:.06em;padding:2px 6px;border-radius:6px;flex:none;line-height:1.4}

/* summary (ruled like a ledger page) */
.summary{position:relative;overflow:hidden;background:var(--hero);color:var(--hero-ink);border-radius:20px;padding:20px 20px 18px 30px;box-shadow:var(--shadow);transition:background-color .35s}
.summary::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(to bottom,transparent 0 27px,var(--hero-line) 27px 28px);pointer-events:none}
.summary::after{content:"";position:absolute;top:0;bottom:0;left:16px;width:1px;background:rgba(255,120,110,.22);pointer-events:none}
.summary > *{position:relative}
.summary .label{font-size:13px;color:var(--hero-muted);letter-spacing:.06em}
.sum-lines{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.sum-line{min-width:0}
.sl-main{display:flex;align-items:baseline;gap:10px;min-width:0}
.sl-main .code{background:rgba(255,255,255,.12);color:var(--hero-ink);transform:translateY(-3px)}
.sl-main .big{font-weight:800;line-height:1.2;font-size:clamp(28px,8vw,36px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sum-lines.multi .sl-main .big{font-size:clamp(22px,6vw,26px)}
.sl-main .big.neg{color:#ffb3aa}
.sl-sub{font-size:12px;color:var(--hero-muted);margin-top:2px;display:flex;flex-wrap:wrap;gap:4px 14px}
.sl-sub b{color:var(--hero-ink);font-weight:600}

/* source cards */
.sources{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 8px;scrollbar-width:thin}
.src{flex:0 0 min(80%,270px);scroll-snap-align:start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:10px;transition:border-color .2s,box-shadow .2s,transform .15s;min-width:0}
.src:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.src.active{border-color:hsl(var(--h) 55% 45%);box-shadow:0 0 0 3px hsl(var(--h) 60% 50% / .18)}
@media (min-width:900px){.sources{flex-direction:column;overflow:visible;padding:0}.src{flex:none}}
.src-top{display:flex;align-items:center;gap:8px;min-width:0}
.dot{width:9px;height:9px;border-radius:50%;background:hsl(var(--h) 60% 48%);flex:none}
.src-name{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.tag{font-size:11px;padding:2px 7px;border-radius:99px;font-weight:500;flex:none}
.tag.neg{background:var(--danger-soft);color:var(--danger)}
.tag.low{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.cur-line{display:flex;flex-direction:column;gap:6px;min-width:0}
.cur-line + .cur-line{padding-top:10px;border-top:1px dashed var(--line)}
.cl-top{display:flex;align-items:baseline;gap:8px;min-width:0}
.cl-top .code{background:var(--surface-2);color:var(--muted);transform:translateY(-2px)}
.src-remain{font-size:21px;font-weight:800;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.src-remain.neg{color:var(--danger)}
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:inherit;background:hsl(var(--h) 55% 46%);transition:width .7s cubic-bezier(.2,.8,.2,1)}
.cur-line.is-neg .bar i{background:var(--danger)}
.src-foot{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);min-width:0}
.src-foot span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.src-foot .flow{display:flex;gap:8px}
.src-foot .in{color:var(--accent)}

/* daily budget */
.budget{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
.budget .sec-title{margin:0}
.bud-row{display:flex;flex-direction:column;gap:6px;min-width:0}
.bud-top{display:flex;align-items:baseline;gap:8px;min-width:0}
.bud-top .code{background:var(--accent-soft);color:var(--accent)}
.bud-val{display:flex;align-items:baseline;gap:4px;min-width:0;white-space:nowrap;overflow:hidden}
.bud-val b{font-size:19px;font-weight:800}
.bud-val span{color:var(--muted);font-size:13px}
.bud-row.over .bud-val b{color:var(--danger)}
.bud-row .bar i{background:var(--accent)}
.bud-row.warn .bar i{background:var(--warn)}
.bud-row.over .bar i{background:var(--danger)}
.bud-top .tag{margin-left:auto}

/* trend chart */
.chart-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:24px;display:flex;flex-direction:column;gap:12px;min-width:0}
.chart-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.chart-head h2{font-size:17px;font-weight:700}
.chart-head .range{font-size:12.5px;color:var(--muted);font-weight:400;margin-left:6px}
.chart-ctrl{display:flex;gap:8px;flex-wrap:wrap}
.chart-ctrl .seg{align-self:auto}
.chart-stats{display:flex;gap:6px 22px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.chart-stats b{display:block;font-size:17px;color:var(--fg);font-weight:800;white-space:nowrap}
.chart-stats .neg{color:var(--danger)}
.lg{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle;background:var(--c)}
.lg.dash{width:14px;height:0;border-radius:0;background:none;border-top:2px dashed var(--c)}
.chart-wrap .bud-ln{fill:none;stroke:var(--muted);stroke-width:1.6;stroke-dasharray:6 5;opacity:.55}
.chart-wrap{position:relative;width:100%;min-width:0;touch-action:pan-y}
.chart-wrap svg{display:block;width:100%;height:auto;overflow:visible}
.chart-wrap .ax{fill:var(--muted);font-size:10.5px;font-family:var(--font-num)}
.chart-wrap .gl{stroke:var(--line);stroke-width:1}
.chart-wrap .guide{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3;opacity:0;transition:opacity .15s}
.chart-wrap .guide.show{opacity:1}
.chart-wrap .pt{transition:r .15s}
.chart-wrap .empty-t{fill:var(--muted);font-size:13px;font-family:var(--font-body)}
.chart-wrap .draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw .9s cubic-bezier(.3,.7,.2,1) forwards}
.chart-wrap .fade{opacity:0;animation:fadeOnly .6s .3s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fadeOnly{to{opacity:1}}
.chart-tip{position:absolute;top:0;pointer-events:none;background:var(--fg);color:var(--bg);font-size:12px;line-height:1.5;padding:6px 10px;border-radius:9px;white-space:nowrap;opacity:0;transition:opacity .15s;z-index:2}
.chart-tip.show{opacity:1}
.chart-tip b{font-weight:600}

/* ledger */
.main-col{min-width:0}
.list-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.list-head h2{font-size:20px;font-weight:700}
.filters{display:flex;flex-direction:column;gap:10px;margin-bottom:6px}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted);pointer-events:none}
.search .input{padding-left:38px;background:var(--surface)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font-size:13.5px;display:inline-flex;align-items:center;gap:7px;transition:background-color .18s,color .18s,border-color .18s}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip .dot{width:7px;height:7px}

.day{margin-top:18px}
.day-head{display:flex;justify-content:space-between;align-items:baseline;gap:4px 8px;color:var(--muted);font-size:13px;padding:0 4px 8px;flex-wrap:wrap}
.day-head b{color:var(--fg);font-weight:500}
.day-head .in{color:var(--accent)}
.items{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.item{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer;transition:background-color .15s}
.item:first-child{border-top:0}
.item:hover{background:var(--surface-2)}
.item.flash{animation:flash 1.4s ease}
.item.rise{animation:rise .4s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@keyframes flash{0%{background:var(--accent-soft)}100%{background:transparent}}
.avatar{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:700;background:hsl(var(--h) var(--av-s) var(--av-bg-l));color:hsl(var(--h) var(--av-s) var(--av-fg-l))}
.avatar svg{width:20px;height:20px}
.avatar.in{background:var(--accent-soft);color:var(--accent)}
.avatar.tr{background:var(--surface-2);color:var(--fg);border:1px solid var(--line)}
.item-main{min-width:0}
.item-title{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-note{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-meta{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;min-width:0}
.item-meta .dot{width:6px;height:6px}
.item-meta span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-meta .badge{flex:none;font-size:10.5px;padding:1px 6px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line)}
.item-right{display:flex;align-items:center;gap:6px}
.amt{font-weight:700;font-size:15.5px;white-space:nowrap;text-align:right}
.amt.pos{color:var(--accent)}
.amt small{display:block;font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--muted)}
.amt .sub{display:block;font-size:11.5px;font-weight:500;color:var(--muted)}
.item-actions{display:flex;gap:2px;opacity:0;transition:opacity .15s}
.item:hover .item-actions,.item:focus-within .item-actions{opacity:1}
@media (hover:none){.item-actions{display:none}}

.empty{text-align:center;padding:48px 20px;border:1px dashed var(--line);border-radius:18px;margin-top:16px;display:flex;flex-direction:column;align-items:center;gap:8px}
.empty .ill{width:64px;height:64px;border-radius:18px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin-bottom:6px}
.empty .ill svg{width:30px;height:30px}
.empty h3{font-size:16px}
.empty p{color:var(--muted);font-size:14px;max-width:34ch}
.empty .btn{margin-top:8px}

.fab{position:fixed;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:30;width:58px;height:58px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 12px 28px -10px var(--accent);transition:transform .2s cubic-bezier(.2,.8,.2,1),background-color .35s}
.fab:hover{transform:translateY(-2px)}
.fab:active{transform:scale(.94)}
.fab svg{width:26px;height:26px}
.hide-mobile{display:none}
@media (min-width:900px){.fab{display:none}.hide-mobile{display:inline-flex}}

/* modals */
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal.confirm{z-index:60}
.backdrop{position:absolute;inset:0;background:rgba(6,14,13,.45);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);opacity:0;transition:opacity .28s}
.sheet{position:relative;width:100%;max-height:92vh;max-height:92dvh;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;background:var(--surface);border-radius:22px 22px 0 0;padding:10px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));transform:translateY(100%);transition:transform .34s cubic-bezier(.2,.8,.2,1),background-color .35s;box-shadow:0 -10px 40px -10px rgba(0,0,0,.3)}
.grip{width:40px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 10px}
.modal.show .backdrop{opacity:1}
.modal.show .sheet{transform:none}
@media (min-width:640px){
  .modal{align-items:center;padding:24px}
  .sheet{max-width:500px;border-radius:22px;padding:22px 24px;transform:translateY(14px) scale(.97);opacity:0;transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .22s,background-color .35s}
  .sheet.wide{max-width:580px}
  .sheet.narrow{max-width:400px}
  .modal.show .sheet{opacity:1;transform:none}
  .grip{display:none}
}
.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px}
.sheet-head h3{font-size:19px;font-weight:700}
.sheet-head .sub{color:var(--muted);font-size:13.5px;margin-top:4px;max-width:46ch}
.sheet form,.stack{display:flex;flex-direction:column;gap:16px}
.sheet-actions{display:flex;align-items:center;gap:8px;margin-top:4px;flex-wrap:wrap}
.spacer{flex:1}

.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field > label,.lbl{font-size:13px;color:var(--muted);font-weight:500}
.opt{font-weight:400;opacity:.8}
.input{width:100%;min-width:0;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:16px;outline:none;transition:border-color .18s,box-shadow .18s,background-color .18s}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);background:var(--surface)}
textarea.input{resize:vertical;min-height:64px}
.input:disabled{opacity:.6}

.seg.type-tabs{display:grid;grid-template-columns:repeat(3,1fr);width:100%;margin-top:-4px}
.type-tabs button{display:flex;align-items:center;justify-content:center;gap:6px;padding:9px 6px}
.type-tabs svg{width:16px;height:16px}

.amount-box{display:flex;align-items:baseline;gap:10px;border-bottom:2px solid var(--line);padding:4px 2px 8px;transition:border-color .2s;min-width:0}
.amount-box:focus-within{border-color:var(--accent)}
.amount-box .cur{font-family:var(--font-num);font-weight:700;color:var(--muted);font-size:18px;flex:none}
.amount-input{flex:1;min-width:0;width:100%;border:0;background:transparent;outline:none;font-size:36px;font-weight:800;padding:0}
.amount-box.sm{padding-bottom:6px}
.amount-box.sm .cur{font-size:14px}
.amount-box.sm .amount-input{font-size:22px;font-weight:700}
.two-col{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:420px){.two-col.split{grid-template-columns:1fr 1fr}}
.field-hint{font-size:12px;color:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin-top:-8px;min-height:20px;white-space:pre-line}
.hint.neg{color:var(--danger)}
.arrow-sep{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;margin:-6px 0}
.arrow-sep::before,.arrow-sep::after{content:"";flex:1;height:1px;background:var(--line)}
.arrow-sep svg{width:18px;height:18px}

.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick button{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:8px 12px;display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-width:0;max-width:100%;text-align:left;transition:border-color .18s,background-color .18s,box-shadow .18s,opacity .18s}
.pick button .pn{display:flex;align-items:center;gap:6px;font-weight:500;font-size:14px;max-width:100%}
.pick button .pn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick button .pb{font-size:12px;color:var(--muted);white-space:nowrap}
.pick button.on{border-color:hsl(var(--h) 55% 45%);background:var(--surface);box-shadow:0 0 0 3px hsl(var(--h) 60% 50% / .18)}
.pick button:disabled{opacity:.4;cursor:not-allowed}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:4px;align-self:flex-start;max-width:100%}
.seg button{border:0;background:transparent;border-radius:9px;padding:6px 14px;font-family:var(--font-num);font-weight:700;font-size:13px;letter-spacing:.05em;color:var(--muted);transition:background-color .18s,color .18s,box-shadow .18s}
.seg button:disabled{opacity:.35;cursor:not-allowed}
.seg.text button{font-family:var(--font-body);font-weight:500;letter-spacing:0;padding:6px 12px}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}

.quick{display:flex;flex-wrap:wrap;gap:6px}
.quick button{border:1px solid var(--line);background:transparent;border-radius:99px;padding:4px 11px;font-size:13px;color:var(--muted);transition:color .15s,border-color .15s,background-color .15s}
.quick button:hover{color:var(--fg);border-color:var(--accent)}
.quick button.on{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.row-gap{display:flex;gap:8px}
.form-error{color:var(--danger);font-size:13.5px}
.form-error:not(:empty){animation:shake .35s}
@keyframes shake{25%{transform:translateX(-4px)}50%{transform:translateX(4px)}75%{transform:translateX(-2px)}}
.fade-in{animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}}

/* settings */
.block{display:flex;flex-direction:column;gap:10px;min-width:0}
.block + .block{padding-top:16px;border-top:1px solid var(--line)}
.block-head h4{font-size:15px;font-weight:700}
.block-head p{font-size:12.5px;color:var(--muted)}
.pref-row{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap;min-width:0}
.pref-row > .lbl{display:flex;align-items:center;gap:6px}
.pref-row > .lbl b{font-weight:500;color:var(--fg)}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatch{width:32px;height:32px;border-radius:50%;border:2px solid transparent;background:var(--sw);box-shadow:inset 0 0 0 3px var(--surface);padding:0;transition:transform .15s,border-color .2s}
.swatch:hover{transform:scale(1.08)}
.swatch.on{border-color:var(--sw)}
.src-cards{display:flex;flex-direction:column;gap:10px}
.src-card{border:1px solid var(--line);border-radius:16px;background:var(--surface-2);padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0;transition:opacity .22s,transform .22s;animation:rise .3s cubic-bezier(.2,.8,.2,1)}
.src-card.leaving,.bal-row.leaving{opacity:0;transform:translateX(16px)}
.sc-head{display:flex;align-items:center;gap:8px;min-width:0}
.sc-head .dot{margin-left:4px}
.sc-head .input{flex:1;font-weight:500}
.src-card .input{background:var(--surface);padding:9px 10px}
.bal-rows{display:flex;flex-direction:column;gap:6px;padding-left:17px}
.bal-row{display:grid;grid-template-columns:86px minmax(0,1fr) 32px;gap:6px;align-items:center;min-width:0;transition:opacity .22s,transform .22s}
.bal-row .cur-in{text-transform:uppercase;font-family:var(--font-num);font-weight:700;letter-spacing:.04em;text-align:center;padding-inline:6px}
.bal-row .amt-in{text-align:right}
.bal-row .row-note{grid-column:1/-1;font-size:12px;color:var(--muted);padding-left:2px}
.bal-row.removed .input{text-decoration:line-through;opacity:.6}
.bal-row.removed .row-note,.src-card.removed > .row-note{color:var(--danger)}
.src-card.removed{border-style:dashed;opacity:.8}
.src-card.removed .sc-head .input{text-decoration:line-through}
.src-card > .row-note{font-size:12px;padding-left:21px}
.add-cur{align-self:flex-start;margin-left:13px}
.danger-zone{flex-direction:row!important;align-items:center;justify-content:space-between;gap:12px}
.danger-zone b{font-weight:500;font-size:14px}
.danger-zone p{font-size:12.5px;color:var(--muted)}

/* toast */
.toasts{position:fixed;left:0;right:0;bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:70;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
@media (min-width:900px){.toasts{bottom:28px}}
.toast{pointer-events:auto;background:var(--fg);color:var(--bg);padding:10px 14px 10px 16px;border-radius:12px;font-size:14px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 30px -10px rgba(0,0,0,.4);opacity:0;transform:translateY(10px) scale(.98);transition:opacity .25s,transform .25s;max-width:100%}
.toast.show{opacity:1;transform:none}
.toast.error{background:var(--danger);color:#fff}
.toast button{background:none;border:0;color:var(--accent);font-weight:700;padding:2px 4px}

/* 嵌入模式：頁面被放進「自動撐高」的預覽框時，固定在畫面底部的元素會跑到很長頁面的最底下，
   所以改成在使用者點擊的位置附近顯示彈窗，並把新增按鈕放回頂部 */
html.embedded .fab{display:none}
html.embedded .hide-mobile{display:inline-flex}
html.embedded .modal{position:absolute;inset:0 0 auto 0;height:var(--doc-h,100%);align-items:flex-start;padding:0 12px}
html.embedded .sheet{margin-top:var(--sheet-top,16px);max-width:520px;border-radius:22px;max-height:none;overflow:visible;padding:20px 18px;transform:translateY(14px) scale(.97);opacity:0;transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .22s}
html.embedded .modal.show .sheet{transform:none;opacity:1}
html.embedded .grip{display:none}
html.embedded .toasts{position:absolute;top:var(--toast-top,16px);bottom:auto}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap topbar-in">
    <div class="brand">
      <div class="logo" aria-hidden="true" data-i18n="logo">帳</div>
      <div><h1 data-i18n="appName">記帳本</h1><p id="todayLabel"></p></div>
    </div>
    <div class="top-actions">
      <button class="btn primary hide-mobile" id="btnAddTop" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span data-i18n="addEntry">新增帳目</span>
      </button>
      <button class="icon-btn boxed" id="btnSettings" type="button" data-i18n-aria="settings" aria-label="設定">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
  </div>
</header>

<main class="wrap layout">
  <aside class="side">
    <section class="summary" data-i18n-aria="summaryAria">
      <div class="label" data-i18n="balanceTotal">可用餘額合計</div>
      <div class="sum-lines" id="sumLines"></div>
    </section>
    <section class="budget" id="budgetBox" hidden>
      <h2 class="sec-title"><span data-i18n="todayBudget">今日預算</span> <span class="muted small" style="letter-spacing:0;font-weight:500" data-i18n="budgetLeft">剩餘 / 預算</span></h2>
      <div id="budgetList" style="display:flex;flex-direction:column;gap:12px"></div>
    </section>
    <section>
      <h2 class="sec-title"><span data-i18n="sources">存錢來源</span> <button class="link" id="btnManage" type="button" data-i18n="manageSources">管理來源</button></h2>
      <div class="sources" id="sourceList"></div>
    </section>
  </aside>

  <section class="main-col">
    <div class="chart-card" id="chartCard" hidden>
      <div class="chart-head">
        <h2><span data-i18n="trend">收支趨勢</span><span class="range" id="chartRange"></span></h2>
        <div class="chart-ctrl">
          <div class="seg" id="chartCur" role="radiogroup" data-i18n-aria="currency"></div>
          <div class="seg text" id="chartPeriod" role="radiogroup"></div>
        </div>
      </div>
      <div class="chart-stats num" id="chartStats"></div>
      <div class="chart-wrap" id="chartWrap">
        <svg id="chartSvg" role="img"></svg>
        <div class="chart-tip num" id="chartTip"></div>
      </div>
    </div>
    <div class="list-head">
      <h2 data-i18n="ledger">帳目紀錄</h2>
      <span class="muted small num" id="entryCount"></span>
    </div>
    <div class="filters">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input class="input" id="search" type="search" data-i18n-ph="searchPh" autocomplete="off">
      </div>
      <div class="seg text" id="typeFilter" role="tablist"></div>
      <div class="chips" id="filterChips" role="tablist" data-i18n-aria="filterAria"></div>
    </div>
    <div id="entryList"></div>
    <div class="empty" id="emptyState" hidden>
      <div class="ill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h12l4 4v12H4z"/><path d="M8 10h8M8 14h8M8 18h5"/></svg></div>
      <h3 id="emptyTitle"></h3>
      <p id="emptyText"></p>
      <button class="btn primary" id="btnAddEmpty" type="button" data-i18n="addEntry">新增帳目</button>
    </div>
  </section>
</main>

<button class="fab" id="fab" type="button" data-i18n-aria="addEntry" aria-label="新增帳目">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<datalist id="curList"></datalist>

<!-- 帳目彈窗：支出 / 增值 / 轉賬 -->
<div class="modal" id="entryModal" hidden>
  <div class="backdrop" data-close></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="entryTitle">
    <div class="grip"></div>
    <div class="sheet-head">
      <h3 id="entryTitle"></h3>
      <button class="icon-btn" type="button" data-close data-i18n-aria="close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <form id="entryForm" novalidate>
      <div class="seg text type-tabs" id="typeTabs" role="tablist"></div>

      <div class="field">
        <span class="lbl" id="srcLbl"></span>
        <div class="pick" id="fSource" role="radiogroup" aria-labelledby="srcLbl"></div>
      </div>
      <div class="field" id="curField">
        <span class="lbl" id="curLbl" data-i18n="currency">貨幣</span>
        <div class="seg" id="fCur" role="radiogroup" aria-labelledby="curLbl"></div>
      </div>

      <div class="arrow-sep" data-show="transfer" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg></div>
      <div class="field" data-show="transfer">
        <span class="lbl" id="srcToLbl" data-i18n="toSrc">轉入</span>
        <div class="pick" id="fSourceTo" role="radiogroup" aria-labelledby="srcToLbl"></div>
      </div>
      <div class="field" id="curFieldTo">
        <span class="lbl" id="curToLbl" data-i18n="toCurrency">轉入貨幣</span>
        <div class="seg" id="fCurTo" role="radiogroup" aria-labelledby="curToLbl"></div>
      </div>

      <div class="field">
        <label for="fAmount" id="amountLbl"></label>
        <div class="amount-box"><span class="cur" id="curPrefix">MOP</span><input id="fAmount" class="amount-input num" type="text" inputmode="decimal" placeholder="0.00" autocomplete="off"></div>
      </div>
      <div class="two-col split" data-show="transfer">
        <div class="field" id="receivedField">
          <label for="fReceived" data-i18n="received">到帳金額</label>
          <div class="amount-box sm"><span class="cur" id="curPrefixTo">HKD</span><input id="fReceived" class="amount-input num" type="text" inputmode="decimal" placeholder="0.00" autocomplete="off"></div>
          <span class="field-hint" data-i18n="receivedHint"></span>
        </div>
        <div class="field">
          <label for="fFee" data-i18n="fee">手續費</label>
          <div class="amount-box sm"><span class="cur" id="curPrefixFee">MOP</span><input id="fFee" class="amount-input num" type="text" inputmode="decimal" placeholder="0" autocomplete="off"></div>
          <span class="field-hint" data-i18n="feeHint"></span>
        </div>
      </div>
      <p class="hint num" id="afterHint"></p>

      <div class="field" data-show="expense">
        <label for="fPurpose" data-i18n="purpose">用途</label>
        <input id="fPurpose" class="input" maxlength="40" data-i18n-ph="purposePh" autocomplete="off">
        <div class="quick" id="quickPurpose"></div>
      </div>
      <div class="field" data-show="topup">
        <label for="fOrigin" data-i18n="origin">資金來源</label>
        <input id="fOrigin" class="input" maxlength="40" data-i18n-ph="originPh" autocomplete="off">
        <div class="quick" id="quickOrigin"></div>
      </div>
      <div class="field">
        <label for="fNote"><span id="noteLbl"></span> <span class="opt" data-i18n="optional">（選填）</span></label>
        <textarea id="fNote" class="input" rows="2" maxlength="200" data-i18n-ph="notePh"></textarea>
      </div>
      <div class="field">
        <label for="fDate" data-i18n="datetime">日期時間</label>
        <div class="row-gap"><input id="fDate" class="input" type="datetime-local"><button class="btn sm" type="button" id="btnNow" data-i18n="now">現在</button></div>
      </div>
      <p class="form-error" id="entryError" role="alert"></p>
      <div class="sheet-actions">
        <button class="btn ghost-danger" type="button" id="btnDeleteEntry" data-i18n="del">刪除</button>
        <span class="spacer"></span>
        <button class="btn" type="button" data-close data-i18n="cancel">取消</button>
        <button class="btn primary" type="submit" id="btnSaveEntry"></button>
      </div>
    </form>
  </div>
</div>

<!-- 設定彈窗 -->
<div class="modal" id="settingsModal" hidden>
  <div class="backdrop" data-close></div>
  <div class="sheet wide" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div class="grip"></div>
    <div class="sheet-head">
      <div><h3 id="settingsTitle"></h3><p class="sub" id="settingsSub"></p></div>
      <button class="icon-btn" type="button" data-close id="settingsX" data-i18n-aria="close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="stack">
      <div class="block">
        <div class="block-head">
          <h4 data-i18n="appearance">外觀與語言</h4>
          <p data-i18n="appearanceHint">即時套用並自動儲存。</p>
        </div>
        <div class="pref-row">
          <span class="lbl" id="langLbl" data-i18n="language">語言</span>
          <div class="seg text" id="prefLang" role="radiogroup" aria-labelledby="langLbl"></div>
        </div>
        <div class="pref-row">
          <span class="lbl" id="modeLbl" data-i18n="mode">顯示模式</span>
          <div class="seg text" id="prefMode" role="radiogroup" aria-labelledby="modeLbl"></div>
        </div>
        <div class="pref-row">
          <span class="lbl" id="accentLbl"><span data-i18n="accent">主題色</span> · <b id="accentName"></b></span>
          <div class="swatches" id="prefAccent" role="radiogroup" aria-labelledby="accentLbl"></div>
        </div>
      </div>
      <div class="block">
        <div class="block-head">
          <h4 data-i18n="srcBlockTitle">存錢來源與餘額</h4>
          <p data-i18n="srcBlockText"></p>
        </div>
        <div class="src-cards" id="srcCards"></div>
        <button class="btn dashed" type="button" id="btnAddSource" data-i18n="addSource">＋ 新增來源</button>
      </div>
      <div class="block">
        <div class="block-head">
          <h4 data-i18n="budget">單日預算</h4>
          <p data-i18n="budgetHint"></p>
        </div>
        <div class="bal-rows" id="budRows" style="padding-left:0"></div>
        <button class="link add-cur" type="button" id="btnAddBudget" data-i18n="addBudget" style="margin-left:0">＋ 新增預算</button>
      </div>
      <div class="block">
        <div class="field" style="max-width:240px">
          <label for="fDefCur" data-i18n="defCur">預設貨幣</label>
          <input id="fDefCur" class="input num" list="curList" maxlength="6" placeholder="MOP" style="text-transform:uppercase;font-weight:700">
          <span class="muted small" data-i18n="defCurHint"></span>
        </div>
      </div>
      <div class="block danger-zone" id="dangerZone">
        <div><b data-i18n="resetTitle">清除所有資料</b><p data-i18n="resetText"></p></div>
        <button class="btn sm outline-danger" type="button" id="btnReset" data-i18n="resetBtn">清除</button>
      </div>
      <p class="form-error" id="settingsError" role="alert"></p>
      <div class="sheet-actions">
        <span class="spacer"></span>
        <button class="btn" type="button" data-close id="settingsCancel" data-i18n="cancel">取消</button>
        <button class="btn primary" type="button" id="btnSaveSettings"></button>
      </div>
    </div>
  </div>
</div>

<!-- 確認彈窗 -->
<div class="modal confirm" id="confirmModal" hidden>
  <div class="backdrop" data-cancel></div>
  <div class="sheet narrow" role="alertdialog" aria-modal="true" aria-labelledby="cTitle" aria-describedby="cMsg">
    <div class="grip"></div>
    <div class="stack">
      <div><h3 id="cTitle" style="font-size:18px"></h3><p id="cMsg" class="muted" style="margin-top:6px;font-size:14px"></p></div>
      <div class="sheet-actions"><span class="spacer"></span><button class="btn" type="button" data-cancel data-i18n="cancel">取消</button><button class="btn danger" type="button" id="cOk"></button></div>
    </div>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
(function(){
'use strict';
const $ = (s, el = document) => el.querySelector(s);
const root = document.documentElement;

/* ---------- 語言 ---------- */

function detectLang(){
  const l = (navigator.language || '').toLowerCase();
  if (/^zh-(cn|sg|hans)/.test(l)) return 'zh-Hans';
  if (l.startsWith('zh')) return 'zh-Hant';
  if (l.startsWith('en')) return 'en';
  return 'zh-Hant';
}

/* ---------- 工具 ---------- */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const r2 = n => Math.round((Number(n) || 0) * 100) / 100;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const parseNum = v => { const n = parseFloat(String(v).replace(/[,\s]/g, '')); return Number.isFinite(n) ? n : NaN; };
const normCur = v => String(v || '').trim().replace(/\$+$/, '').toUpperCase().slice(0, 6);
const ZERO_DEC = ['JPY', 'KRW', 'VND', 'IDR'];
const fmtN = (n, cur) => { n = r2(n); const d = ZERO_DEC.includes(cur) ? 0 : 2; return (n < 0 ? '-' : '') + Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d }); };
const fmt = (n, cur) => `${cur} ${fmtN(n, cur)}`;
const pad = n => String(n).padStart(2, '0');
const toLocalInput = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
function hue(str){ let h = 7; for (const c of String(str)) h = (h * 31 + c.codePointAt(0)) % 360; return h; }

/* ---------- 資料 ----------
   sources: [{id, name, balances:[{id, cur, amount}]}]
   entries:
     支出 {type:'expense',  sourceId, cur, amount, purpose, note, datetime}
     增值 {type:'topup',    sourceId, cur, amount, origin,  note, datetime}
     轉賬 {type:'transfer', sourceId, cur, amount, fee, toId, toCur, toAmount, note, datetime}
   來源的 balance 是使用者設定的原始餘額，程式不會改寫；所有餘額都是即時計算出來顯示用。 */
let sources, entries, settings;
function load(){
  sources  = store.get(KEY.sources, []);
  entries  = store.get(KEY.entries, []);
  settings = Object.assign({ defaultCur: 'MOP', lastSource: null, lastCur: null, accent: 'teal', mode: 'system', lang: detectLang() }, store.get(KEY.settings, {}));
  if (!Array.isArray(sources)) sources = [];
  if (!Array.isArray(entries)) entries = [];
  if (!I18N[settings.lang]) settings.lang = 'zh-Hant';
  if (!PALETTES[settings.accent]) settings.accent = 'teal';
  if (!['system','light','dark'].includes(settings.mode)) settings.mode = 'system';
  if (!Array.isArray(settings.budgets)) settings.budgets = [];
  // 舊版資料自動轉換
  const legacy = normCur(settings.currency) || settings.defaultCur || 'MOP';
  let migrated = false;
  if (settings.currency !== undefined){ settings.defaultCur = legacy; delete settings.currency; migrated = true; }
  sources = sources.map(s => {
    if (Array.isArray(s.balances)) return s;
    migrated = true;
    return { id: s.id, name: s.name, balances: [{ id: uid(), cur: legacy, amount: r2(s.balance) }] };
  });
  entries.forEach(e => {
    if (!e.cur){ e.cur = legacy; migrated = true; }
    if (!TYPES.includes(e.type)){ e.type = 'expense'; migrated = true; }
  });
  if (migrated){ saveSources(); saveEntries(); saveSettings(); }
  lang = settings.lang;
}
function saveSources(){ store.set(KEY.sources, sources); }
function saveEntries(){ store.set(KEY.entries, entries); }
function saveSettings(){ store.set(KEY.settings, settings); }

const srcById = id => sources.find(s => s.id === id);
const balOf = (s, cur) => s && s.balances.find(b => b.cur === cur);
/* 一筆紀錄牽涉到的 (來源, 貨幣) */
const refs = e => e.type === 'transfer' ? [[e.sourceId, e.cur], [e.toId, e.toCur]] : [[e.sourceId, e.cur]];
const valid = e => refs(e).every(([s, c]) => balOf(srcById(s), c));
/* 一筆紀錄對某個 (來源, 貨幣) 的流入 / 流出 */
function flow(e, sid, cur){
  const here = e.sourceId === sid && e.cur === cur;
  if (e.type === 'topup') return here ? [e.amount, 0] : [0, 0];
  if (e.type === 'transfer'){
    let i = 0, o = 0;
    if (here) o += e.amount + (e.fee || 0);
    if (e.toId === sid && e.toCur === cur) i += e.toAmount;
    return [i, o];
  }
  return here ? [0, e.amount] : [0, 0];
}
function flowsOf(sid, cur, excludeId){
  let i = 0, o = 0;
  for (const e of entries){
    if (e.id === excludeId || !valid(e)) continue;
    const [a, b] = flow(e, sid, cur); i += a; o += b;
  }
  return { in: r2(i), out: r2(o) };
}
/* 計算後餘額：只用於顯示，不寫回來源資料 */
const remainOf = (s, b, excludeId) => { const f = flowsOf(s.id, b.cur, excludeId); return r2(b.amount + f.in - f.out); };
/* 「花掉」的錢：支出 + 轉賬手續費（都以 e.cur 計） */
const spendOf = e => e.type === 'expense' ? e.amount : (e.type === 'transfer' ? (e.fee || 0) : 0);
const topupOf = e => e.type === 'topup' ? e.amount : 0;

/* 單日預算：每種貨幣獨立，只計當天該貨幣的支出 + 手續費 */
const todayYmd = () => toLocalInput(new Date()).slice(0, 10);
const budgetOf = cur => (settings.budgets || []).find(b => b.cur === cur);
function daySpend(cur, ymd, excludeId){
  let s = 0;
  for (const e of entries){
    if (e.id === excludeId || e.cur !== cur || !e.datetime.startsWith(ymd) || !valid(e)) continue;
    s += spendOf(e);
  }
  return r2(s);
}

function curOrder(list){
  const seen = [];
  list.forEach(c => { if (!seen.includes(c)) seen.push(c); });
  return seen.sort((a, b) => (b === settings.defaultCur) - (a === settings.defaultCur));
}
function sumStr(list, pick){
  const m = {};
  list.forEach(e => { const v = pick(e); if (v) m[e.cur] = r2((m[e.cur] || 0) + v); });
  return curOrder(Object.keys(m)).map(c => fmt(m[c], c)).join(' · ');
}
function titleOf(e){
  if (e.type === 'topup') return e.origin;
  if (e.type === 'transfer') return `${srcById(e.sourceId).name} → ${srcById(e.toId).name}`;
  return e.purpose;
}

function dayLabel(ymd){
  const [y, m, d] = ymd.split('-').map(Number);
  const date = new Date(y, m - 1, d);
  const today = new Date(); today.setHours(0,0,0,0);
  const diff = Math.round((today - date) / 86400000);
  const opts = { month: lang === 'en' ? 'short' : 'long', day: 'numeric', weekday: 'short' };
  if (y !== today.getFullYear()) opts.year = 'numeric';
  const base = date.toLocaleDateString(LOCALE[lang], opts);
  if (diff === 0) return `${t('today')} · ${base}`;
  if (diff === 1) return `${t('yesterday')} · ${base}`;
  return base;
}

function animateNumber(el, from, to, cur){
  el.classList.toggle('neg', to < 0);
  if (reduceMotion || !Number.isFinite(from) || from === to){ el.textContent = fmtN(to, cur); return; }
  const t0 = performance.now(), dur = 550;
  const step = now => {
    const p = Math.min(1, (now - t0) / dur), k = 1 - Math.pow(1 - p, 3);
    el.textContent = fmtN(from + (to - from) * k, cur);
    if (p < 1 && el.isConnected) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function renderSummary(){
  const now = new Date(), ym = `${now.getFullYear()}-${pad(now.getMonth()+1)}`;

  sources.forEach(s => s.balances.forEach(b => {
    tot[b.cur] = tot[b.cur] || { base: 0, remain: 0, in: 0, out: 0, month: 0 };
    tot[b.cur].base += b.amount;
    tot[b.cur].remain += remainOf(s, b);
  }));
  entries.forEach(e => {
    if (!valid(e)) return;
    const c = tot[e.cur];
    c.in += topupOf(e);
    c.out += spendOf(e);
