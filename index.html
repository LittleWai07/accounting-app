/* ---------- 收支趨勢折線圖（日 / 週 / 月） ---------- */
let chartCur = null;
let chartAnimate = true;
let chartData = null;
const PERIODS = ['day', 'week', 'month'];
const parseDT = s => { const [ds, ts = '0:0'] = s.split('T'); const [y, m, d] = ds.split('-').map(Number); const [h, mi] = ts.split(':').map(Number); return new Date(y, m - 1, d, h || 0, mi || 0); };
const md = d => `${d.getMonth() + 1}/${d.getDate()}`;
function buckets(period){
  const now = new Date(), out = [];
  if (period === 'day'){
    const t0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    for (let i = 13; i >= 0; i--){
      const s = new Date(t0); s.setDate(t0.getDate() - i);
      const e = new Date(s); e.setDate(s.getDate() + 1);
      out.push({ start: s, end: e, label: md(s), tip: s.toLocaleDateString(LOCALE[lang], { month: 'short', day: 'numeric', weekday: 'short' }) });
    }
  } else if (period === 'week'){
    const t0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    t0.setDate(t0.getDate() - ((t0.getDay() + 6) % 7));   // 週一開始
    for (let i = 11; i >= 0; i--){
      const s = new Date(t0); s.setDate(t0.getDate() - i * 7);
      const e = new Date(s); e.setDate(s.getDate() + 7);
      const last = new Date(e); last.setDate(e.getDate() - 1);
      out.push({ start: s, end: e, label: md(s), tip: t('weekRange', md(s), md(last)) });
    }
  } else {
    for (let i = 11; i >= 0; i--){
      const s = new Date(now.getFullYear(), now.getMonth() - i, 1);
      const e = new Date(s.getFullYear(), s.getMonth() + 1, 1);
      out.push({ start: s, end: e, label: s.toLocaleDateString(LOCALE[lang], { month: 'short' }), tip: s.toLocaleDateString(LOCALE[lang], { year: 'numeric', month: 'long' }) });
    }
  }
  return out;
}
function niceMax(v){
  if (!(v > 0)) return 100;
  const mag = Math.pow(10, Math.floor(Math.log10(v)));
  for (const f of [1, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]) if (f * mag >= v) return f * mag;
  return 10 * mag;
}
const axisNum = v => v >= 10000 ? (v / 1000).toLocaleString('en-US', { maximumFractionDigits: 1 }) + 'k' : v.toLocaleString('en-US', { maximumFractionDigits: v < 10 ? 1 : 0 });

function renderChart(){
  const curs = curOrder(sources.flatMap(s => s.balances.map(b => b.cur)));
  $('#chartCard').hidden = !curs.length;
  if (!curs.length) return;
  if (!curs.includes(chartCur)) chartCur = curs.includes(settings.defaultCur) ? settings.defaultCur : curs[0];
  const period = PERIODS.includes(settings.chartPeriod) ? settings.chartPeriod : 'day';

  $('#chartCur').hidden = curs.length < 2;
  $('#chartCur').innerHTML = curs.map(c => `<button type="button" role="radio" aria-checked="${c === chartCur}" class="${c === chartCur ? 'on' : ''}" data-ccur="${esc(c)}">${esc(c)}</button>`).join('');
  $('#chartPeriod').innerHTML = PERIODS.map(p => { const k = 'period' + p[0].toUpperCase() + p.slice(1); return `<button type="button" role="radio" aria-checked="${p === period}" class="${p === period ? 'on' : ''}" data-period="${p}">${t(k)}</button>`; }).join('');
  $('#chartRange').textContent = t({ day: 'rangeDay', week: 'rangeWeek', month: 'rangeMonth' }[period]);

  // 統計每個區間的支出（含手續費）與收入（增值）
  const bk = buckets(period);
  bk.forEach(b => { b.exp = 0; b.inc = 0; });
  const first = bk[0].start, endAll = bk[bk.length - 1].end;
  for (const e of entries){
    if (e.cur !== chartCur || !valid(e)) continue;
    const d = parseDT(e.datetime);
    if (d < first || d >= endAll) continue;
    const b = bk.find(x => d >= x.start && d < x.end);
    if (b){ b.exp += spendOf(e); b.inc += topupOf(e); }
  }
  bk.forEach(b => { b.exp = r2(b.exp); b.inc = r2(b.inc); });
  // 有設定該幣別的單日預算：日 = 預算，週 = 預算 × 7，月 = 預算 × 當月天數
  const bud = budgetOf(chartCur);
  bk.forEach(b => { b.bud = bud ? r2(bud.amount * Math.round((b.end - b.start) / 86400000)) : 0; });
  const totExp = r2(bk.reduce((a, b) => a + b.exp, 0)), totInc = r2(bk.reduce((a, b) => a + b.inc, 0)), net = r2(totInc - totExp);

  // 顏色：支出用警示紅；收入用主題色（主題色本身偏紅 / 橙時改用青綠以免撞色）
  const cs = getComputedStyle(root);
  const expC = cs.getPropertyValue('--danger').trim();
  const incC = ['coral', 'amber'].includes(settings.accent) ? PALETTES.teal[isDark() ? 1 : 0][0] : cs.getPropertyValue('--accent').trim();
  $('#chartStats').innerHTML = `
    <span><span class="lg" style="--c:${expC}"></span>${t('sumOut')}<b>${fmt(totExp, chartCur)}</b></span>
    <span><span class="lg" style="--c:${incC}"></span>${t('income')}<b>${fmt(totInc, chartCur)}</b></span>
    ${bud ? `<span><span class="lg dash" style="--c:var(--muted)"></span>${t('budgetPer')[period]}<b>${fmt(bk[bk.length - 1].bud, chartCur)}</b></span>` : ''}
    <span>${t('net')}<b class="${net < 0 ? 'neg' : ''}">${net > 0 ? '+' : ''}${fmt(net, chartCur)}</b></span>`;

  // 繪圖
  const wrap = $('#chartWrap'), svg = $('#chartSvg');
  const W = Math.max(280, Math.round(wrap.clientWidth || 600));
  const H = W < 520 ? 200 : 230;
  const padL = 40, padR = 10, padT = 12, padB = 24;
  const n = bk.length, max = niceMax(Math.max(...bk.map(b => Math.max(b.exp, b.inc, b.bud))));
  const x = i => padL + i * (W - padL - padR) / (n - 1);
  const y = v => padT + (1 - v / max) * (H - padT - padB);
  const base = y(0);
  let g = '';
  for (let k = 0; k <= 4; k++){
    const v = max * k / 4, yy = y(v).toFixed(1);
    g += `<line class="gl" x1="${padL}" x2="${W - padR}" y1="${yy}" y2="${yy}"/><text class="ax" x="${padL - 6}" y="${(+yy + 3.5).toFixed(1)}" text-anchor="end">${axisNum(v)}</text>`;
  }
  const step = Math.max(1, Math.ceil(n / Math.max(2, Math.floor((W - padL - padR) / 46))));
  bk.forEach((b, i) => { if ((n - 1 - i) % step === 0) g += `<text class="ax" x="${x(i).toFixed(1)}" y="${H - 6}" text-anchor="middle">${esc(b.label)}</text>`; });
  const line = key => bk.map((b, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)} ${y(b[key]).toFixed(1)}`).join(' ');
  const empty = !totExp && !totInc;
  const anim = chartAnimate && !reduceMotion;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.setAttribute('aria-label', `${t('trend')} ${chartCur}: ${t('sumOut')} ${fmtN(totExp, chartCur)}, ${t('income')} ${fmtN(totInc, chartCur)}`);
  const budLn = bud ? `<path class="bud-ln ${anim ? 'fade' : ''}" d="${line('bud')}"/>` : '';
  svg.innerHTML = g + budLn + (empty
    ? `<text class="empty-t" x="${(padL + W - padR) / 2}" y="${(padT + base) / 2}" text-anchor="middle">${esc(t('chartEmpty'))}</text>`
    : `<path class="${anim ? 'fade' : ''}" d="${line('exp')} L${x(n - 1).toFixed(1)} ${base.toFixed(1)} L${x(0).toFixed(1)} ${base.toFixed(1)} Z" style="fill:${expC};fill-opacity:.1;stroke:none"/>
       <path class="ln ${anim ? 'draw' : ''}" d="${line('inc')}" style="fill:none;stroke:${incC};stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round"/>
       <path class="ln ${anim ? 'draw' : ''}" d="${line('exp')}" style="fill:none;stroke:${expC};stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round"/>
       ${bk.map((b, i) => `<circle class="pt ${anim ? 'fade' : ''}" data-i="${i}" cx="${x(i).toFixed(1)}" cy="${y(b.inc).toFixed(1)}" r="${b.inc ? 2.6 : 0}" data-r0="${b.inc ? 2.6 : 0}" style="fill:var(--surface);stroke:${incC};stroke-width:2"/>
         <circle class="pt ${anim ? 'fade' : ''}" data-i="${i}" cx="${x(i).toFixed(1)}" cy="${y(b.exp).toFixed(1)}" r="${b.exp ? 2.8 : 0}" data-r0="${b.exp ? 2.8 : 0}" style="fill:var(--surface);stroke:${expC};stroke-width:2"/>`).join('')}`)
    + `<line class="guide" id="chartGuide" y1="${padT}" y2="${base.toFixed(1)}" x1="0" x2="0"/>
       <rect id="chartHit" x="${padL - 6}" y="0" width="${W - padL - padR + 12}" height="${H}" fill="transparent"/>`;
  if (anim) svg.querySelectorAll('.draw').forEach(p => p.style.setProperty('--len', Math.ceil(p.getTotalLength ? p.getTotalLength() : 2000)));
  chartAnimate = false;
  chartData = { bk, x, W, padL, padR, n, empty };
  $('#chartTip').classList.remove('show');
}

function chartPoint(ev){
  if (!chartData || chartData.empty) return;
  const svg = $('#chartSvg'), rect = svg.getBoundingClientRect();
  const sx = (ev.clientX - rect.left) * chartData.W / rect.width;
  const { n, padL, padR, W, x, bk } = chartData;
  const i = Math.max(0, Math.min(n - 1, Math.round((sx - padL) / ((W - padL - padR) / (n - 1)))));
  const b = bk[i], px = x(i);
  const guide = $('#chartGuide');
  guide.setAttribute('x1', px); guide.setAttribute('x2', px); guide.classList.add('show');
  svg.querySelectorAll('.pt').forEach(c => c.setAttribute('r', +c.dataset.i === i && +c.dataset.r0 > 0 ? 4.5 : c.dataset.r0));
  const tip = $('#chartTip');
  tip.innerHTML = `<b>${esc(b.tip)}</b><br>${t('sumOut')} ${fmt(b.exp, chartCur)}<br>${t('income')} ${fmt(b.inc, chartCur)}${b.bud ? `<br>${t('budgetLine')} ${fmt(b.bud, chartCur)}${b.exp > b.bud ? ` · ${t('overBudget')}` : ''}` : ''}`;
  tip.classList.add('show');
  const left = px * rect.width / W, tw = tip.offsetWidth;
  tip.style.left = Math.max(0, Math.min(rect.width - tw, left - tw / 2)) + 'px';
  tip.style.top = '-6px';
}
function chartLeave(){
  $('#chartTip').classList.remove('show');
  const g = $('#chartGuide'); if (g) g.classList.remove('show');
  document.querySelectorAll('#chartSvg .pt').forEach(c => c.setAttribute('r', c.dataset.r0));
}
$('#chartWrap').addEventListener('pointermove', chartPoint);
$('#chartWrap').addEventListener('pointerdown', chartPoint);
$('#chartWrap').addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') chartLeave(); });
document.addEventListener('pointerdown', e => { if (!e.target.closest('#chartWrap')) chartLeave(); });
$('#chartPeriod').addEventListener('click', e => {
  const b = e.target.closest('[data-period]'); if (!b) return;
  settings.chartPeriod = b.dataset.period; saveSettings(); chartAnimate = true; renderChart();
});
$('#chartCur').addEventListener('click', e => {
  const b = e.target.closest('[data-ccur]'); if (!b) return;
  chartCur = b.dataset.ccur; chartAnimate = true; renderChart();
});
let chartW = 0, chartRT;
window.addEventListener('resize', () => {
  clearTimeout(chartRT);
  chartRT = setTimeout(() => { const w = $('#chartWrap').clientWidth; if (w && w !== chartW){ chartW = w; renderChart(); } }, 150);
});

function renderFilters(){
  $('#typeFilter').innerHTML = ['all', ...TYPES].map(k => `<button type="button" role="tab" aria-selected="${filterType === k}" class="${filterType === k ? 'on' : ''}" data-type="${k}">${t(k)}</button>`).join('');
  const chips = [{ id: 'all', name: t('all') }, ...sources];
  $('#filterChips').innerHTML = chips.map(c =>
    `<button type="button" class="chip ${filterSource === c.id ? 'on' : ''}" data-filter="${c.id}" role="tab" aria-selected="${filterSource === c.id}" ${c.id !== 'all' ? `style="--h:${hue(c.id)}"` : ''}>${c.id !== 'all' ? '<span class="dot"></span>' : ''}${esc(c.name)}</button>`
  ).join('');
}

function filteredEntries(){
  const q = query.trim().toLowerCase();
  return entries
    .filter(valid)
    .filter(e => filterType === 'all' || e.type === filterType)
    .filter(e => filterSource === 'all' || e.sourceId === filterSource || (e.type === 'transfer' && e.toId === filterSource))
    .filter(e => !q || [e.purpose, e.origin, e.note, srcById(e.sourceId).name, e.toId && srcById(e.toId).name, e.cur, e.toCur, t(e.type)]
      .some(x => String(x || '').toLowerCase().includes(q)))
    .sort((a, b) => b.datetime.localeCompare(a.datetime) || (b.createdAt || 0) - (a.createdAt || 0));
}

function itemHTML(e, anim){
  const s = srcById(e.sourceId), h = hue(s.id), time = e.datetime.slice(11, 16);
  let avatar, meta, amt;
  if (e.type === 'topup'){
    avatar = `<div class="avatar in">${TYPE_ICON.topup}</div>`;
    meta = `<span class="badge">${t('topup')}</span><span class="dot"></span><span>${esc(s.name)}</span><span>· ${time}</span>`;
    amt = `<div class="amt num pos"><small>${esc(e.cur)}</small>+${fmtN(e.amount, e.cur)}</div>`;
  } else if (e.type === 'transfer'){
    avatar = `<div class="avatar tr">${TYPE_ICON.transfer}</div>`;
    meta = `<span class="badge">${t('transfer')}</span><span>${time}</span>${e.fee ? `<span>· ${esc(t('feeMeta', fmt(e.fee, e.cur)))}</span>` : ''}`;
    amt = `<div class="amt num"><small>${esc(e.cur)}</small>${fmtN(e.amount, e.cur)}${e.toCur !== e.cur ? `<span class="sub">→ ${esc(fmt(e.toAmount, e.toCur))}</span>` : ''}</div>`;
  } else {
    avatar = `<div class="avatar" style="--h:${h}">${esc([...e.purpose][0] || '•')}</div>`;
    meta = `<span class="dot"></span><span>${esc(s.name)}</span><span>· ${time}</span>`;
    amt = `<div class="amt num"><small>${esc(e.cur)}</small>-${fmtN(e.amount, e.cur)}</div>`;
  }
  const title = titleOf(e);
  return `<div class="item ${anim}" data-id="${e.id}" tabindex="0" role="button" aria-label="${t('edit')} ${esc(t(e.type))} ${esc(title)}">
    ${avatar}
    <div class="item-main">
      <div class="item-title">${esc(title)}</div>
      ${e.note ? `<div class="item-note">${esc(e.note)}</div>` : ''}
      <div class="item-meta num" style="--h:${h}">${meta}</div>
    </div>
    <div class="item-right">
      ${amt}
      <div class="item-actions">
        <button type="button" class="icon-btn sm" data-act="edit" aria-label="${t('edit')}">${ICON_EDIT}</button>
        <button type="button" class="icon-btn sm" data-act="del" aria-label="${t('del')}">${ICON_DEL}</button>
      </div>
    </div>
  </div>`;
}

function renderEntries(){
  const list = filteredEntries();
  $('#entryCount').textContent = list.length ? t('count', list.length) : '';

  const empty = $('#emptyState');
  if (!list.length){
    $('#entryList').innerHTML = '';
    empty.hidden = false;
    const noData = !entries.some(valid);
    $('#emptyTitle').textContent = t(noData ? 'emptyTitle' : 'noMatchTitle');
    $('#emptyText').textContent = t(noData ? 'emptyText' : 'noMatchText');
    $('#btnAddEmpty').hidden = !noData;
    return;
  }
  empty.hidden = true;

  const groups = [];
  for (const e of list){
    const d = e.datetime.slice(0, 10);
    let g = groups[groups.length - 1];
    if (!g || g.d !== d){ g = { d, items: [] }; groups.push(g); }
    g.items.push(e);
  }
  let n = 0;
  $('#entryList').innerHTML = groups.map(g => {
    const out = sumStr(g.items, spendOf), inn = sumStr(g.items, topupOf);
    const parts = [out && `${t('sumOut')} ${out}`, inn && `<span class="in">${t('sumIn')} +${inn}</span>`].filter(Boolean).join(' · ');
    return `<div class="day">
      <div class="day-head"><b>${esc(dayLabel(g.d))}</b><span class="num">${parts}</span></div>
      <div class="items">${g.items.map(e => {
        const anim = firstPaint && !reduceMotion && n < 14 ? `rise" style="animation-delay:${(n++) * 35}ms` : (e.id === flashId ? 'flash' : '');
        return itemHTML(e, anim);
      }).join('')}</div>
    </div>`;
  }).join('');
  firstPaint = false;
  flashId = null;
}

function render(){
  if (filterSource !== 'all' && !srcById(filterSource)) filterSource = 'all';
  renderSummary(); renderBudget(); renderSources(); renderChart(); renderFilters(); renderEntries();
}

/* ---------- 嵌入偵測 ---------- */
let lastTapY = null;
document.addEventListener('pointerdown', e => { lastTapY = e.pageY; }, true);
document.addEventListener('click', e => { if (e.pageY) lastTapY = e.pageY; }, true);
/* 視窗高度遠超螢幕高度 = 被放進自動撐高的框裡，fixed 定位不再對應可見範圍 */
function checkEmbedded(){
  const scr = Math.max(screen.availHeight || 0, screen.height || 0) || 900;
  const on = window.innerHeight > scr + 80;
  root.classList.toggle('embedded', on);
  return on;
}
window.addEventListener('resize', checkEmbedded);
function anchorTop(){
  const y = lastTapY != null ? lastTapY : (window.scrollY + 40);
  return Math.max(12, y - 140);
}

/* ---------- 彈窗 ---------- */
function openModal(m){
  m.hidden = false;
  if (checkEmbedded()){
    root.style.setProperty('--doc-h', Math.max(document.documentElement.scrollHeight, window.innerHeight) + 'px');
    m.style.setProperty('--sheet-top', anchorTop() + 'px');
  }
  void m.offsetWidth;
  m.classList.add('show');
  document.body.classList.add('locked');
  if (root.classList.contains('embedded')){
    const sheet = m.querySelector('.sheet');
    setTimeout(() => { try { sheet.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } catch(e){} }, 60);
  }
}
function closeModal(m){
  m.classList.remove('show');
  setTimeout(() => {
    if (!m.classList.contains('show')) m.hidden = true;
    if (!document.querySelector('.modal.show')) document.body.classList.remove('locked');
  }, 320);
}
['#entryModal', '#settingsModal'].forEach(sel => {
  const m = $(sel);
  m.addEventListener('click', e => {
    if (e.target.closest('[data-close]') && m.dataset.locked !== '1') closeModal(m);
  });
});

let confirmResolve = null;
function confirmBox({ title, message, ok }){
  $('#cTitle').textContent = title;
  $('#cMsg').textContent = message;
  $('#cOk').textContent = ok;
  openModal($('#confirmModal'));
  setTimeout(() => $('#cOk').focus(), 50);
  return new Promise(res => { confirmResolve = res; });
}
function settleConfirm(v){ if (!confirmResolve) return; const r = confirmResolve; confirmResolve = null; closeModal($('#confirmModal')); r(v); }
$('#confirmModal').addEventListener('click', e => { if (e.target.closest('[data-cancel]')) settleConfirm(false); });
$('#cOk').addEventListener('click', () => settleConfirm(true));

document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if ($('#confirmModal').classList.contains('show')) return settleConfirm(false);
  if ($('#entryModal').classList.contains('show')) return closeModal($('#entryModal'));
  const sm = $('#settingsModal');
  if (sm.classList.contains('show') && sm.dataset.locked !== '1') closeModal(sm);
});

function toast(msg, type = '', action){
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.innerHTML = `<span>${esc(msg)}</span>`;
  let timer;
  const kill = () => { clearTimeout(timer); el.classList.remove('show'); setTimeout(() => el.remove(), 280); };
  if (action){
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = action.label;
    b.onclick = () => { action.fn(); kill(); };
    el.appendChild(b);
  }
  if (checkEmbedded()) root.style.setProperty('--toast-top', anchorTop() + 'px');
  $('#toasts').appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  timer = setTimeout(kill, action ? 4500 : 2400);
}

/* ---------- 新增 / 編輯紀錄 ---------- */
let editingId = null;
let curType = 'expense';
const pA = { src: null, cur: null };   // 支出/增值的來源；轉賬的轉出方
const pB = { src: null, cur: null };   // 轉賬的轉入方
const pairs = () => sources.flatMap(s => s.balances.map(b => [s.id, b.cur]));
const canTransfer = () => pairs().length >= 2;
const samePair = () => pA.src === pB.src && pA.cur === pB.cur;
const availFor = (s, b) => remainOf(s, b, editingId);

function chooseCur(state, keep){
  const s = srcById(state.src);
  if (!s){ state.cur = null; return; }
  if (keep && balOf(s, state.cur)) return;
  state.cur = balOf(s, settings.lastCur) ? settings.lastCur : s.balances[0].cur;
}
/* 轉入方預設：第一個與轉出方不同的 (來源, 貨幣)，優先同幣種 */
function defaultTo(){
  const ps = pairs().filter(([s, c]) => !(s === pA.src && c === pA.cur));
  const best = ps.find(([s, c]) => s !== pA.src && c === pA.cur) || ps.find(([s]) => s !== pA.src) || ps[0];
  pB.src = best ? best[0] : null; pB.cur = best ? best[1] : null;
}

function pickHTML(state, disableSameAs){
  return sources.map(s => {
    // 轉入方：如果此來源只有一種貨幣且與轉出方相同，就不能選
    const blocked = disableSameAs && s.balances.length === 1 && s.id === disableSameAs.src && s.balances[0].cur === disableSameAs.cur;
    return `<button type="button" role="radio" aria-checked="${state.src === s.id}" class="${state.src === s.id ? 'on' : ''}" data-pick="${s.id}" style="--h:${hue(s.id)}" ${blocked ? 'disabled' : ''}>
      <span class="pn"><span class="dot"></span><span>${esc(s.name)}</span></span>
      ${s.balances.map(b => `<span class="pb num">${esc(b.cur)} ${fmtN(availFor(s, b), b.cur)}</span>`).join('')}
    </button>`;
  }).join('');
}
function curHTML(state, disableSameAs){
  const s = srcById(state.src);
  return s ? s.balances.map(b => {
    const blocked = disableSameAs && s.id === disableSameAs.src && b.cur === disableSameAs.cur;
    return `<button type="button" role="radio" aria-checked="${b.cur === state.cur}" class="${b.cur === state.cur ? 'on' : ''}" data-cur="${esc(b.cur)}" ${blocked ? 'disabled' : ''}>${esc(b.cur)}</button>`;
  }).join('') : '';
}
function renderPicks(){
  const isTr = curType === 'transfer';
  $('#fSource').innerHTML = pickHTML(pA);
  $('#fCur').innerHTML = curHTML(pA);
  const sa = srcById(pA.src);
  $('#curField').hidden = !sa || sa.balances.length < 2;
  if (isTr){
    $('#fSourceTo').innerHTML = pickHTML(pB, pA);
    $('#fCurTo').innerHTML = curHTML(pB, pA);
    const sb = srcById(pB.src);
    $('#curFieldTo').hidden = !sb || sb.balances.length < 2;
  } else $('#curFieldTo').hidden = true;
  $('#curPrefix').textContent = pA.cur || '';
  $('#curPrefixFee').textContent = pA.cur || '';
  $('#curPrefixTo').textContent = pB.cur || '';
  $('#receivedField').hidden = !(isTr && pB.cur && pB.cur !== pA.cur);
  updateHint();
}

function renderQuick(){
  const build = (box, inputSel, field, type, defaults) => {
    const recent = [];
    [...entries].filter(e => e.type === type).sort((a, b) => b.datetime.localeCompare(a.datetime))
      .forEach(e => { if (e[field] && !recent.includes(e[field])) recent.push(e[field]); });
    const list = [...new Set([...recent.slice(0, 4), ...defaults])].slice(0, 8);
    const cur = $(inputSel).value.trim();
    $(box).innerHTML = list.map(p => `<button type="button" data-q="${esc(p)}" class="${p === cur ? 'on' : ''}">${esc(p)}</button>`).join('');
  };
  build('#quickPurpose', '#fPurpose', 'purpose', 'expense', t('defaultPurposes'));
  build('#quickOrigin', '#fOrigin', 'origin', 'topup', t('defaultOrigins'));
}

function updateHint(){
  const hint = $('#afterHint');
  const sa = srcById(pA.src), ba = balOf(sa, pA.cur);
  hint.classList.remove('neg');
  if (!ba){ hint.textContent = ''; return; }
  const amt = parseNum($('#fAmount').value), a = amt > 0 ? amt : 0;
  const rmA = availFor(sa, ba);
  if (curType === 'expense'){
    const after = r2(rmA - a);
    hint.classList.toggle('neg', after < 0);
    let text = a ? t('afterHint', sa.name, ba.cur, fmtN(after, ba.cur), after < 0) : t('currentHint', sa.name, ba.cur, fmtN(rmA, ba.cur));
    const bud = budgetOf(ba.cur);
    if (bud){
      const ymd = ($('#fDate').value || toLocalInput(new Date())).slice(0, 10);
      const left = r2(bud.amount - daySpend(ba.cur, ymd, editingId) - a);
      text += '\n' + t('budgetDayHint', ba.cur, `${fmtN(left, ba.cur)} / ${fmtN(bud.amount, ba.cur)}`, left < 0);
      if (left < 0) hint.classList.add('neg');
    }
    hint.textContent = text;
  } else if (curType === 'topup'){
    hint.textContent = a ? t('topupHint', sa.name, ba.cur, fmtN(rmA + a, ba.cur)) : t('currentHint', sa.name, ba.cur, fmtN(rmA, ba.cur));
  } else {
    if (!canTransfer()){ hint.textContent = t('needTwo'); hint.classList.add('neg'); return; }
    const sb = srcById(pB.src), bb = balOf(sb, pB.cur);
    if (!bb){ hint.textContent = ''; return; }
    const fee = parseNum($('#fFee').value), f = fee > 0 ? fee : 0;
    const cross = pA.cur !== pB.cur;
    const recv = cross ? (parseNum($('#fReceived').value) > 0 ? parseNum($('#fReceived').value) : 0) : a;
    const afterA = r2(rmA - a - f), afterB = r2(availFor(sb, bb) + recv);
    hint.classList.toggle('neg', afterA < 0);
    hint.textContent = t('transferHint', sa.name, ba.cur, fmtN(afterA, ba.cur), afterA < 0, sb.name, bb.cur, fmtN(afterB, bb.cur));
  }
}

function setType(type){
  curType = type;
  $('#typeTabs').innerHTML = TYPES.map(k => `<button type="button" role="tab" aria-selected="${k === type}" class="${k === type ? 'on' : ''}" data-tab="${k}">${TYPE_ICON[k]}${t(k)}</button>`).join('');
  $('#typeTabs').hidden = !!editingId;
  document.querySelectorAll('#entryForm [data-show]').forEach(el => {
    const show = el.dataset.show.split(' ').includes(type);
    if (show && el.hidden) { el.classList.remove('fade-in'); void el.offsetWidth; el.classList.add('fade-in'); }
    el.hidden = !show;
  });
  $('#entryTitle').textContent = (editingId ? t('editTitle') : t('newTitle'))[type];
  $('#srcLbl').textContent = t('srcLabel')[type];
  $('#amountLbl').textContent = t('amountLabel')[type];
  $('#noteLbl').textContent = t('noteLabel')[type];
  $('#btnSaveEntry').textContent = t(editingId ? 'save' : 'add');
  if (type === 'transfer' && (!pB.src || samePair())) defaultTo();
  $('#btnSaveEntry').disabled = type === 'transfer' && !canTransfer();
  $('#entryError').textContent = '';
  renderPicks();
}

function openEntry(id, type){
  if (!sources.length){ openSettings(true); return; }
  editingId = id || null;
  const e = id ? entries.find(x => x.id === id) : null;
  $('#btnDeleteEntry').hidden = !e;
  $('#fAmount').value = e ? e.amount : '';
  $('#fPurpose').value = e && e.type === 'expense' ? e.purpose : '';
  $('#fOrigin').value = e && e.type === 'topup' ? e.origin : '';
  $('#fFee').value = e && e.type === 'transfer' ? e.fee : '';
  $('#fReceived').value = e && e.type === 'transfer' && e.toCur !== e.cur ? e.toAmount : '';
  $('#fNote').value = e ? (e.note || '') : '';
  $('#fDate').value = e ? e.datetime : toLocalInput(new Date());
  if (e){
    pA.src = e.sourceId; pA.cur = e.cur;
    pB.src = e.type === 'transfer' ? e.toId : null; pB.cur = e.type === 'transfer' ? e.toCur : null;
  } else {
    pA.src = filterSource !== 'all' ? filterSource : (srcById(settings.lastSource) ? settings.lastSource : sources[0].id);
    chooseCur(pA); pB.src = null; pB.cur = null;
  }
  renderQuick();
  setType(e ? e.type : (type || (filterType !== 'all' ? filterType : 'expense')));
  openModal($('#entryModal'));
  if (window.matchMedia('(hover:hover)').matches) setTimeout(() => $('#fAmount').focus(), 120);
}

function deleteEntry(id){
  const idx = entries.findIndex(e => e.id === id);
  if (idx < 0) return;
  const [removed] = entries.splice(idx, 1);
  saveEntries(); render();
  toast(t('toastDeleted', titleOf(removed)), '', { label: t('restore'), fn(){ entries.push(removed); saveEntries(); flashId = removed.id; render(); } });
}

$('#entryForm').addEventListener('submit', ev => {
  ev.preventDefault();
  const err = (msg, focus) => { const el = $('#entryError'); el.textContent = ''; void el.offsetWidth; el.textContent = msg; if (focus) $(focus).focus(); };
  const amount = r2(parseNum($('#fAmount').value));
  const note = $('#fNote').value.trim();
  const datetime = $('#fDate').value || toLocalInput(new Date());
  if (!balOf(srcById(pA.src), pA.cur)) return err(t('errSource'));
  if (!(amount > 0)) return err(t('errAmount'), '#fAmount');
  let data = { type: curType, sourceId: pA.src, cur: pA.cur, amount, note, datetime };
  if (curType === 'expense'){
    const purpose = $('#fPurpose').value.trim();
    if (!purpose) return err(t('errPurpose'), '#fPurpose');
    data.purpose = purpose;
  } else if (curType === 'topup'){
    const origin = $('#fOrigin').value.trim();
    if (!origin) return err(t('errOrigin'), '#fOrigin');
    data.origin = origin;
  } else {
    if (!balOf(srcById(pB.src), pB.cur)) return err(t('errTo'));
    if (samePair()) return err(t('errSame'));
    const feeRaw = $('#fFee').value.trim();
    const fee = feeRaw === '' ? 0 : r2(parseNum(feeRaw));
    if (!(fee >= 0)) return err(t('errFee'), '#fFee');
    let toAmount = amount;
    if (pA.cur !== pB.cur){
      toAmount = r2(parseNum($('#fReceived').value));
      if (!(toAmount > 0)) return err(t('errReceived'), '#fReceived');
    }
    Object.assign(data, { fee, toId: pB.src, toCur: pB.cur, toAmount });
  }
  if (editingId){
    const i = entries.findIndex(x => x.id === editingId);
    const old = entries[i];
    entries[i] = Object.assign({ id: old.id, createdAt: old.createdAt }, data, { updatedAt: Date.now() });
    flashId = old.id;
  } else {
    const e = Object.assign({ id: uid(), createdAt: Date.now() }, data);
    entries.push(e);
    flashId = e.id;
  }
  settings.lastSource = pA.src; settings.lastCur = pA.cur;
  saveEntries(); saveSettings();
  closeModal($('#entryModal'));
  toast(t(editingId ? 'toastUpdated' : 'toastAdded', t(curType)));
  render();
});

$('#typeTabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b && b.dataset.tab !== curType) setType(b.dataset.tab); });
$('#fSource').addEventListener('click', e => {
  const b = e.target.closest('[data-pick]'); if (!b) return;
  pA.src = b.dataset.pick; chooseCur(pA, true);
  if (curType === 'transfer' && samePair()) defaultTo();
  renderPicks();
});
$('#fCur').addEventListener('click', e => {
  const b = e.target.closest('[data-cur]'); if (!b) return;
  pA.cur = b.dataset.cur;
  if (curType === 'transfer' && samePair()) defaultTo();
  renderPicks();
});
$('#fSourceTo').addEventListener('click', e => {
  const b = e.target.closest('[data-pick]'); if (!b || b.disabled) return;
  pB.src = b.dataset.pick;
  const s = srcById(pB.src);
  if (!balOf(s, pB.cur) || samePair()){
    const pref = s.balances.find(x => x.cur === pA.cur && s.id !== pA.src) || s.balances.find(x => !(s.id === pA.src && x.cur === pA.cur));
    pB.cur = pref ? pref.cur : s.balances[0].cur;
  }
  renderPicks();
});
$('#fCurTo').addEventListener('click', e => { const b = e.target.closest('[data-cur]'); if (!b || b.disabled) return; pB.cur = b.dataset.cur; renderPicks(); });
['#quickPurpose', '#quickOrigin'].forEach(sel => $(sel).addEventListener('click', e => {
  const b = e.target.closest('[data-q]'); if (!b) return;
  $(sel === '#quickPurpose' ? '#fPurpose' : '#fOrigin').value = b.dataset.q; renderQuick();
}));
$('#fPurpose').addEventListener('input', renderQuick);
$('#fOrigin').addEventListener('input', renderQuick);
['#fAmount', '#fFee', '#fReceived'].forEach(s => $(s).addEventListener('input', updateHint));
$('#btnNow').addEventListener('click', () => { $('#fDate').value = toLocalInput(new Date()); updateHint(); });
$('#fDate').addEventListener('change', updateHint);
$('#btnDeleteEntry').addEventListener('click', () => { const id = editingId; closeModal($('#entryModal')); deleteEntry(id); });

/* ---------- 設定 ---------- */
let draft = [];
let setupMode = false;
const countEntries = (id, cur) => entries.filter(e => refs(e).some(([s, c]) => s === id && (cur === undefined || c === cur))).length;
const defCur = () => normCur($('#fDefCur').value) || settings.defaultCur || 'MOP';
const newBal = cur => ({ id: uid(), cur: cur || defCur(), orig: null, amount: '', removed: false });

function renderSettingsText(){
  $('#settingsTitle').textContent = t(setupMode ? 'setupTitle' : 'settings');
  $('#settingsSub').textContent = t(setupMode ? 'setupSub' : 'settingsSub');
  $('#btnSaveSettings').textContent = t(setupMode ? 'setupDone' : 'save');
}
function renderPrefs(){
  $('#prefLang').innerHTML = Object.keys(I18N).map(l => `<button type="button" role="radio" aria-checked="${l === lang}" class="${l === lang ? 'on' : ''}" data-lang="${l}" lang="${l}">${LANG_LABEL[l]}</button>`).join('');
  $('#prefMode').innerHTML = ['system','light','dark'].map(m => { const k = 'mode' + m[0].toUpperCase() + m.slice(1); return `<button type="button" role="radio" aria-checked="${settings.mode === m}" class="${settings.mode === m ? 'on' : ''}" data-mode="${m}">${t(k)}</button>`; }).join('');
  const dark = isDark() ? 1 : 0, names = t('accents');
  $('#prefAccent').innerHTML = Object.keys(PALETTES).map(a => `<button type="button" class="swatch ${settings.accent === a ? 'on' : ''}" role="radio" aria-checked="${settings.accent === a}" data-accent="${a}" style="--sw:${PALETTES[a][dark][0]}" aria-label="${names[a]}" title="${names[a]}"></button>`).join('');
  $('#accentName').textContent = names[settings.accent];
}
$('#prefLang').addEventListener('click', e => {
  const b = e.target.closest('[data-lang]'); if (!b || b.dataset.lang === lang) return;
  const oldDefaults = t('defaultSources');
  lang = settings.lang = b.dataset.lang; saveSettings();
  if (setupMode) draft.forEach((s, i) => { if (s.name === oldDefaults[i]) s.name = t('defaultSources')[i]; });
  applyLang(); renderSettingsText(); renderPrefs(); renderSrcCards(); renderBudRows(); render();
});
$('#prefMode').addEventListener('click', e => {
  const b = e.target.closest('[data-mode]'); if (!b) return;
  settings.mode = b.dataset.mode; saveSettings(); applyTheme(); renderChart();
});
$('#prefAccent').addEventListener('click', e => {
  const b = e.target.closest('[data-accent]'); if (!b) return;
  settings.accent = b.dataset.accent; saveSettings(); applyTheme(); renderChart();
});

function openSettings(isSetup){
  setupMode = !!isSetup || !sources.length;
  const m = $('#settingsModal');
  m.dataset.locked = setupMode ? '1' : '0';
  $('#settingsX').hidden = setupMode;
  $('#settingsCancel').hidden = setupMode;
  $('#dangerZone').hidden = setupMode;
  $('#settingsError').textContent = '';
  $('#fDefCur').value = settings.defaultCur;
  draft = sources.length
    ? sources.map(s => ({ id: s.id, name: s.name, removed: false, bals: s.balances.map(b => ({ id: b.id, cur: b.cur, orig: b.cur, amount: String(b.amount), removed: false })) }))
    : t('defaultSources').map(n => ({ id: uid(), name: n, removed: false, bals: [newBal(settings.defaultCur)] }));
  budDraft = (settings.budgets || []).map(b => ({ id: uid(), cur: b.cur, amount: String(b.amount) }));
  renderSettingsText(); renderPrefs(); renderSrcCards(); renderBudRows();
  openModal(m);
}

/* 單日預算設定 */
let budDraft = [];
function renderBudRows(){
  $('#budRows').innerHTML = budDraft.map((b, i) => `
    <div class="bal-row" data-bi="${i}">
      <input class="input cur-in" id="bdc-${b.id}" data-k="cur" list="curList" value="${esc(b.cur)}" maxlength="6" placeholder="${t('curPh')}" aria-label="${t('currency')}" autocomplete="off" style="background:var(--surface-2)">
      <input class="input num amt-in" id="bda-${b.id}" data-k="amount" type="text" inputmode="decimal" value="${esc(b.amount)}" placeholder="${t('budgetAmt')}" aria-label="${t('budgetAmt')}" autocomplete="off" style="background:var(--surface-2)">
      <button type="button" class="icon-btn sm" data-act="bud-remove" aria-label="${t('removeBudget')}" title="${t('removeBudget')}">${ICON_X}</button>
    </div>`).join('');
}
$('#budRows').addEventListener('input', e => {
  const inp = e.target.closest('[data-k]'); if (!inp) return;
  budDraft[+inp.closest('.bal-row').dataset.bi][inp.dataset.k] = inp.value;
});
$('#budRows').addEventListener('click', e => {
  const btn = e.target.closest('[data-act="bud-remove"]'); if (!btn) return;
  const row = btn.closest('.bal-row'), i = +row.dataset.bi;
  row.classList.add('leaving');
  setTimeout(() => { budDraft.splice(i, 1); renderBudRows(); }, 200);
});
$('#btnAddBudget').addEventListener('click', () => {
  const used = budDraft.map(b => normCur(b.cur));
  const pool = [defCur(), ...draft.flatMap(s => s.bals.map(b => normCur(b.cur))), 'MOP', 'HKD', 'CNY', 'USD'];
  const cur = pool.find(c => c && !used.includes(c)) || '';
  const b = { id: uid(), cur, amount: '' };
  budDraft.push(b); renderBudRows();
  setTimeout(() => $('#' + (cur ? 'bda-' : 'bdc-') + b.id)?.focus(), 30);
});

function renderSrcCards(){
  $('#srcCards').innerHTML = draft.map((s, si) => {
    const n = countEntries(s.id);
    const real = srcById(s.id);
    const rows = s.bals.map((b, bi) => {
      const bn = b.orig ? countEntries(s.id, b.orig) : 0;
      const rb = b.orig && balOf(real, b.orig);
      const note = b.removed
        ? `<p class="row-note">${esc(t('balRemoved', bn))}</p>`
        : (bn && rb ? `<p class="row-note num">${esc(t('balInfo', bn, fmt(remainOf(real, rb), b.orig)))}</p>` : '');
      const dis = s.removed || b.removed ? 'disabled' : '';
      const lbl = t(b.removed ? 'restoreCur' : 'removeCur');
      return `<div class="bal-row ${b.removed ? 'removed' : ''}" data-si="${si}" data-bi="${bi}">
        <input class="input cur-in" id="bc-${b.id}" data-k="cur" list="curList" value="${esc(b.cur)}" maxlength="6" placeholder="${t('curPh')}" aria-label="${t('currency')}" autocomplete="off" ${dis}>
        <input class="input num amt-in" id="ba-${b.id}" data-k="amount" type="text" inputmode="decimal" value="${esc(b.amount)}" placeholder="0.00" aria-label="${t('balance')}" autocomplete="off" ${dis}>
        <button type="button" class="icon-btn sm" data-act="${b.removed ? 'bal-restore' : 'bal-remove'}" aria-label="${lbl}" title="${lbl}" ${s.removed ? 'disabled' : ''}>${b.removed ? ICON_UNDO : ICON_X}</button>
        ${note}
      </div>`;
    }).join('');
    const sl = t(s.removed ? 'restoreSrc' : 'removeSrc');
    return `<div class="src-card ${s.removed ? 'removed' : ''}" data-si="${si}" style="--h:${hue(s.id)}">
      <div class="sc-head">
        <span class="dot"></span>
        <input class="input" id="sn-${s.id}" data-k="name" value="${esc(s.name)}" placeholder="${t('srcNamePh')}" maxlength="20" aria-label="${t('srcNamePh')}" autocomplete="off" ${s.removed ? 'disabled' : ''}>
        <button type="button" class="icon-btn" data-act="${s.removed ? 'src-restore' : 'src-remove'}" aria-label="${sl}" title="${sl}">${s.removed ? ICON_UNDO : ICON_DEL}</button>
      </div>
      ${s.removed ? `<p class="row-note">${esc(t('srcRemoved', n))}</p>` : `
      <div class="bal-rows">${rows}</div>
      <button type="button" class="link add-cur" data-act="add-cur">${t('addCur')}</button>`}
    </div>`;
  }).join('');
}
$('#srcCards').addEventListener('input', e => {
  const inp = e.target.closest('[data-k]'); if (!inp) return;
  const card = inp.closest('.src-card'), s = draft[+card.dataset.si];
  if (inp.dataset.k === 'name'){ s.name = inp.value; return; }
  const b = s.bals[+inp.closest('.bal-row').dataset.bi];
  b[inp.dataset.k] = inp.value;
});
$('#srcCards').addEventListener('click', e => {
  const btn = e.target.closest('[data-act]'); if (!btn) return;
  const card = btn.closest('.src-card'), si = +card.dataset.si, s = draft[si];
  const act = btn.dataset.act;
  if (act === 'src-restore'){ s.removed = false; return renderSrcCards(); }
  if (act === 'src-remove'){
    if (countEntries(s.id)){ s.removed = true; return renderSrcCards(); }
    card.classList.add('leaving');
    return setTimeout(() => { draft.splice(si, 1); renderSrcCards(); }, 200);
  }
  if (act === 'add-cur'){
    const used = s.bals.map(b => normCur(b.cur));
    const pickCur = [defCur(), 'MOP', 'HKD', 'CNY', 'USD'].find(c => !used.includes(c)) || '';
    const b = newBal(pickCur); s.bals.push(b); renderSrcCards();
    return setTimeout(() => $('#' + (pickCur ? 'ba-' : 'bc-') + b.id)?.focus(), 30);
  }
  const row = btn.closest('.bal-row'), bi = +row.dataset.bi, b = s.bals[bi];
  if (act === 'bal-restore'){ b.removed = false; return renderSrcCards(); }
  if (act === 'bal-remove'){
    if (b.orig && countEntries(s.id, b.orig)){ b.removed = true; return renderSrcCards(); }
    row.classList.add('leaving');
    setTimeout(() => { s.bals.splice(bi, 1); renderSrcCards(); }, 200);
  }
});
$('#btnAddSource').addEventListener('click', () => {
  const s = { id: uid(), name: '', removed: false, bals: [newBal()] };
  draft.push(s); renderSrcCards();
  setTimeout(() => $('#sn-' + s.id)?.focus(), 30);
});
$('#btnSaveSettings').addEventListener('click', () => {
  const errEl = $('#settingsError');
  const err = (msg, focusId) => { errEl.textContent = ''; void errEl.offsetWidth; errEl.textContent = msg; if (focusId) $('#' + focusId)?.focus(); };
  const active = draft.filter(s => !s.removed);
  if (!active.length) return err(t('errKeepOne'));
  for (const s of active){
    const name = s.name.trim();
    if (!name) return err(t('errName'), 'sn-' + s.id);
    const bals = s.bals.filter(b => !b.removed);
    if (!bals.length) return err(t('errNeedCur', name));
    const seen = [];
    for (const b of bals){
      const c = normCur(b.cur);
      if (!c) return err(t('errCurEmpty', name), 'bc-' + b.id);
      if (seen.includes(c)) return err(t('errCurDup', name, c), 'bc-' + b.id);
      seen.push(c);
      const v = String(b.amount).trim();
      if (v !== '' && !Number.isFinite(parseNum(v))) return err(t('errBalNum', name, c), 'ba-' + b.id);
    }
  }
  const budgets = [];
  for (const b of budDraft){
    const c = normCur(b.cur), v = String(b.amount).trim();
    if (!c && !v) continue;               // 空白行直接忽略
    if (!c) return err(t('errBudgetCur'), 'bdc-' + b.id);
    if (budgets.some(x => x.cur === c)) return err(t('errBudgetDup', c), 'bdc-' + b.id);
    const n = parseNum(v);
    if (!(n > 0)) return err(t('errBudgetAmt', c), 'bda-' + b.id);
    budgets.push({ cur: c, amount: r2(n) });
  }
  settings.budgets = budgets;
  // 1. 刪除牽涉被移除來源 / 貨幣的紀錄（轉賬任何一方被移除都算）
  const gone = new Set();
  draft.forEach(s => s.bals.forEach(b => { if ((s.removed || b.removed) && b.orig) gone.add(s.id + '|' + b.orig); }));
  entries = entries.filter(e => !refs(e).some(([s, c]) => gone.has(s + '|' + c)));
  // 2. 改了貨幣代碼的行，紀錄跟著改
  const remap = {};
  active.forEach(s => s.bals.forEach(b => { if (!b.removed && b.orig && b.orig !== normCur(b.cur)) remap[s.id + '|' + b.orig] = normCur(b.cur); }));
  entries.forEach(e => {
    const k1 = e.sourceId + '|' + e.cur; if (remap[k1]) e.cur = remap[k1];
    if (e.type === 'transfer'){ const k2 = e.toId + '|' + e.toCur; if (remap[k2]) e.toCur = remap[k2]; }
  });
  // 3. 寫入來源（只有這裡會改原始餘額）
  sources = active.map(s => ({
    id: s.id, name: s.name.trim(),
    balances: s.bals.filter(b => !b.removed).map(b => ({ id: b.id, cur: normCur(b.cur), amount: r2(String(b.amount).trim() === '' ? 0 : parseNum(b.amount)) }))
  }));
  settings.defaultCur = defCur();
  saveSources(); saveEntries(); saveSettings();
  closeModal($('#settingsModal'));
  toast(t(setupMode ? 'toastSetupDone' : 'toastSaved'));
  render();
});
$('#btnReset').addEventListener('click', async () => {
  const ok = await confirmBox({ title: t('resetConfirmTitle'), message: t('resetConfirmMsg'), ok: t('resetConfirmOk') });
  if (!ok) return;
  const keep = { lang: settings.lang, accent: settings.accent, mode: settings.mode };
  Object.values(KEY).forEach(k => store.del(k));
  load(); Object.assign(settings, keep); lang = settings.lang; saveSettings();
  filterSource = 'all'; filterType = 'all'; query = ''; $('#search').value = '';
  render();
  openSettings(true);
  toast(t('resetDone'));
});

/* ---------- 頁面事件 ---------- */
$('#btnSettings').addEventListener('click', () => openSettings(false));
$('#btnManage').addEventListener('click', () => openSettings(false));
['#btnAddTop', '#fab', '#btnAddEmpty'].forEach(s => $(s).addEventListener('click', () => openEntry()));
$('#sourceList').addEventListener('click', e => {
  const c = e.target.closest('[data-src]'); if (!c) return;
  filterSource = filterSource === c.dataset.src ? 'all' : c.dataset.src; render();
});
$('#filterChips').addEventListener('click', e => {
  const c = e.target.closest('[data-filter]'); if (!c) return;
  filterSource = c.dataset.filter; render();
});
$('#typeFilter').addEventListener('click', e => {
  const c = e.target.closest('[data-type]'); if (!c) return;
  filterType = c.dataset.type; renderFilters(); renderEntries();
});
$('#search').addEventListener('input', e => { query = e.target.value; renderEntries(); });
$('#entryList').addEventListener('click', e => {
  const item = e.target.closest('.item'); if (!item) return;
  const act = e.target.closest('[data-act]');
  if (act && act.dataset.act === 'del') return deleteEntry(item.dataset.id);
  openEntry(item.dataset.id);
});
$('#entryList').addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('item')){ e.preventDefault(); openEntry(e.target.dataset.id); }
});
window.addEventListener('storage', e => { if (Object.values(KEY).includes(e.key)){ load(); applyTheme(); applyLang(); render(); } });

/* 跨過午夜時刷新「今日」預算與日期 */
let lastDay = todayYmd();
const checkDay = () => { if (todayYmd() !== lastDay){ lastDay = todayYmd(); applyLang(); render(); } };
setInterval(checkDay, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkDay(); });

/* 任何未預期的錯誤都直接提示，方便找出問題 */
window.addEventListener('error', e => { try { toast('Error: ' + (e.message || e.error), 'error'); } catch(_){} });
window.addEventListener('unhandledrejection', e => { try { toast('Error: ' + (e.reason && e.reason.message || e.reason), 'error'); } catch(_){} });

/* ---------- 啟動 ---------- */
checkEmbedded();
load();
applyTheme();
applyLang();
render();
if (!sources.length) openSettings(true);
})();
</script>
